name: Auto-Approve & Merge Bot PRs (Code Owner)

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve-and-merge:
    name: Approve and Merge Daily Rate PRs
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'github-actions[bot]' || github.event.pull_request.head.ref == 'auto/daily-rate-update'
    steps:
      # 1. Approve the PR on behalf of Code Owner using PAT (if provided) or fallback token
      - name: 🔑 Approve PR as Code Owner
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      # 2. Merge the PR into main
      - name: 🚀 Auto-Merge PR into Main
        run: |
          echo "Merging PR #${{ github.event.pull_request.number }}..."
          gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash || gh pr merge "${{ github.event.pull_request.html_url }}" --squash --admin || true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
