name: Daily Market Email Digest (3:35 PM IST)

on:
  workflow_run:
    workflows: ["Daily Spot Rates Fetcher"]
    types:
      - completed
  schedule:
    - cron: '5 9 * * *' # 3:35 PM IST (10:05 AM UTC) every day - Market Close Digest
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send Daily Digest Email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          APP_URL: 'https://dailyvaultrates.vercel.app'
        run: node scripts/send-daily-digest.js
