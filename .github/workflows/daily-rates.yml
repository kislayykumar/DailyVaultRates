name: Daily Spot Rates Fetcher

on:
  schedule:
    - cron: '0 5 * * *'   # 10:30 AM IST (Indian market open) = 4:00 AM UTC
    - cron: '0 10 * * *'  # 3:30 PM IST (Indian market close) = 10:00 AM UTC
    - cron: '0 12 * * *'  # 5:30 PM IST (Evening wrap) = 12:00 PM UTC
  workflow_dispatch:       # Manual trigger from GitHub Actions UI

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    # ── Retry strategy: retry the entire job up to 3 times on failure ──────────
    # Each attempt waits 5 minutes between retries to let APIs recover
    strategy:
      max-parallel: 1
      fail-fast: false

    steps:
      # ── Step 1: Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Setup Node.js ─────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Step 2b: Install Dependencies ────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Step 3: Attempt 1 — Fetch rates ───────────────────────────────────
      - name: Fetch spot rates (attempt 1)
        id: fetch_attempt_1
        run: node scripts/fetch-rates.js
        continue-on-error: true

      # ── Step 4: Wait then retry if attempt 1 failed ───────────────────────
      - name: Wait before retry (attempt 1 failed)
        if: steps.fetch_attempt_1.outcome == 'failure'
        run: |
          echo "⚠️  Attempt 1 failed. Waiting 3 minutes before retry..."
          sleep 180

      - name: Fetch spot rates (attempt 2)
        id: fetch_attempt_2
        if: steps.fetch_attempt_1.outcome == 'failure'
        run: node scripts/fetch-rates.js
        continue-on-error: true

      # ── Step 5: Wait then retry if attempt 2 failed ───────────────────────
      - name: Wait before retry (attempt 2 failed)
        if: steps.fetch_attempt_1.outcome == 'failure' && steps.fetch_attempt_2.outcome == 'failure'
        run: |
          echo "⚠️  Attempt 2 failed. Waiting 5 minutes before final retry..."
          sleep 300

      - name: Fetch spot rates (attempt 3 — final)
        id: fetch_attempt_3
        if: steps.fetch_attempt_1.outcome == 'failure' && steps.fetch_attempt_2.outcome == 'failure'
        run: node scripts/fetch-rates.js

      # ── Step 6: Validate the output file was created ──────────────────────
      - name: Validate output JSON exists and is valid
        run: |
          TODAY=$(date -u +'%Y/%m/%d')
          FILE="data/${TODAY}.json"
          if [ ! -f "$FILE" ]; then
            echo "❌ ERROR: Data file $FILE was not created!"
            exit 1
          fi
          # Validate it's valid JSON and has required keys
          node -e "
            const d = require('./$FILE');
            const required = ['date','timestamp','metals','currencies'];
            for (const key of required) {
              if (!d[key]) { console.error('Missing key:', key); process.exit(1); }
            }
            if (d.metals.length < 6) { console.error('Expected 6 metals, got', d.metals.length); process.exit(1); }
            if (d.currencies.length < 8) { console.error('Expected 8 currencies, got', d.currencies.length); process.exit(1); }
            console.log('✅ Data file is valid:', Object.keys(d));
            console.log('   Metals:', d.metals.map(m => m.id).join(', '));
            console.log('   Gold 24K INR/g:', d.metals.find(m=>m.id==='gold-24k')?.priceInrGram);
            console.log('   Platinum USD/oz:', d.metals.find(m=>m.id==='platinum')?.priceUsdOunce);
          "

      # ── Step 7: Create Pull Request for rate update ───────────────────────
      - name: Create Pull Request for daily rate update
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): update daily vault rates [skip ci]"
          title: "chore(data): daily rate update"
          body: |
            ### 📊 Automated Daily Vault Rate Update
            - **Trigger**: `Daily Spot Rates Fetcher`
            - **Status**: Validated by `validate-data-schema.js`
          branch: "auto/daily-rate-update"
          base: "main"
          delete-branch: true
          labels: "automated, data-update"

      # ── Step 8: Report job status summary ────────────────────────────────
      - name: Report fetch summary
        if: always()
        run: |
          echo "=== Fetch Summary ==="
          echo "Attempt 1: ${{ steps.fetch_attempt_1.outcome }}"
          echo "Attempt 2: ${{ steps.fetch_attempt_2.outcome }}"
          echo "Attempt 3: ${{ steps.fetch_attempt_3.outcome }}"
          TODAY=$(date -u +'%Y/%m/%d')
          FILE="data/${TODAY}.json"
          if [ -f "$FILE" ]; then
            echo "✅ Output file exists: $FILE ($(wc -c < $FILE) bytes)"
          else
            echo "❌ Output file missing: $FILE"
          fi
